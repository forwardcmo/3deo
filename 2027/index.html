<style>
:root{
  --navy-dark:#0e2547; --navy-deep:#163764; --ink:#0d1b30; --accent:#0091c7; --accent-hover:#0079a6;
  --on-dark:#eaf1fa; --on-dark-muted:rgba(234,241,250,.68); --sky:#8fd3f2;
  --s1:#27409c; --s2:#1f97d4; --s3:#22c39a; --s4:#e0c63f; --s5:#e8643f;
  --font-display:'Archivo','Helvetica Neue',Arial,system-ui,sans-serif;
  --font-body:'Hanken Grotesk','Helvetica Neue',Arial,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--navy-dark); color:var(--on-dark); font-family:var(--font-body); -webkit-font-smoothing:antialiased; overflow:hidden}
canvas{position:fixed; inset:0; width:100%; height:100%; display:block}
.veil{position:fixed; inset:0; background:radial-gradient(ellipse 70% 60% at 50% 50%, rgba(14,37,71,.92) 0%, rgba(14,37,71,.7) 55%, rgba(14,37,71,.35) 100%)}
.readout{position:fixed; top:calc(20px + env(safe-area-inset-top,0px)); right:24px; text-align:right; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:rgba(234,241,250,.55); line-height:1.8; z-index:2}
.wrap{position:relative; z-index:2; min-height:100%; display:grid; place-items:center; padding:24px 16px}
.panel{width:min(420px,100%); text-align:center; display:flex; flex-direction:column; align-items:center; gap:0}
.logo{height:72px; width:auto; display:block; border-radius:2px; box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.eyebrow{margin-top:28px; font-family:var(--font-mono); font-size:11px; font-weight:500; letter-spacing:.22em; text-transform:uppercase; color:var(--sky); display:flex; align-items:center; gap:12px}
.eyebrow::before,.eyebrow::after{content:""; width:22px; height:1px; background:currentColor}
h1{margin:14px 0 0; font-family:var(--font-display); font-weight:800; font-size:clamp(28px,6vw,36px); letter-spacing:-.02em; line-height:1.1; color:#fff}
.sub{margin:12px 0 0; font-size:15.5px; line-height:1.55; color:var(--on-dark-muted); max-width:34ch}
form{margin-top:32px; display:flex; flex-direction:column; align-items:center; gap:18px; width:100%}
.digits{display:flex; gap:12px}
.digits input{width:60px; height:72px; text-align:center; font-family:var(--font-display); font-weight:800; font-size:30px; color:#fff; background:rgba(234,241,250,.06); border:1.5px solid rgba(234,241,250,.22); border-radius:6px; outline:none; caret-color:var(--sky); transition:border-color .15s, background .15s, transform .15s}
.digits input:focus{border-color:var(--sky); background:rgba(143,211,242,.1)}
.digits input.filled{border-color:rgba(143,211,242,.55)}
.digits.bad input{border-color:var(--s5)}
.digits.good input{border-color:var(--s3); background:rgba(34,195,154,.14)}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
button{width:276px; max-width:100%; height:48px; border:0; border-radius:4px; background:var(--accent); color:#fff; font-family:var(--font-body); font-weight:600; font-size:15.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:background .15s}
button:hover{background:var(--accent-hover)}
button:disabled{opacity:.55; cursor:default}
button:focus-visible,.digits input:focus-visible{outline:2px solid var(--sky); outline-offset:3px}
.msg{min-height:22px; font-size:14px; color:var(--on-dark-muted)}
.msg.err{color:#ff9b7e}
.ramp{margin-top:36px; width:120px; height:5px; border-radius:3px; background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5)); opacity:.85}
.foot{margin-top:14px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:rgba(234,241,250,.45)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@media (max-width:420px){ .digits{gap:10px} .digits input{width:54px; height:66px} .readout{display:none} }
@media (prefers-reduced-motion: reduce){ .shake{animation:none} .digits input,button{transition:none} }
</style>
</head>

<script>
(function(){
  // Background: the same generated point-cloud terrain used on the plan's hero.
  var cv=document.getElementById('cloud'), ramp=[[39,64,156],[31,151,212],[34,195,154],[224,198,63],[232,100,63]];
  function col(t){t=Math.max(0,Math.min(.999,t));var s=t*(ramp.length-1),i=Math.floor(s),f=s-i,a=ramp[i],b=ramp[i+1];return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';}
  function h(x,y){return .5+.22*Math.sin(x*.9+Math.sin(y*.6))+.16*Math.cos(y*1.3-x*.4)+.08*Math.sin(x*3.1+y*2.3)+.04*Math.sin(x*7+y*5.5);}
  function rng(s){return function(){s=(s*16807)%2147483647;return s/2147483647;};}
  function draw(){var W=innerWidth,H=innerHeight,d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;var c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.fillStyle='#0e2547';c.fillRect(0,0,W,H);
    var r=rng(11),rows=170,cols=Math.round(W/4.2);for(var j=0;j<rows;j++){var dp=j/rows,py=H*.05+dp*H*1.05;for(var i=0;i<cols;i++){var u=i/cols,z=h(u*6+dp*.5,dp*5),sx=W*(-.05+1.1*u)+(r()-.5)*3,sy=py-z*H*.2*(.55+dp*.6)+(r()-.5)*2;if(r()<.05){z+=.12;sy-=6+r()*8;}c.globalAlpha=.4+dp*.55;c.fillStyle=col(z+(r()-.5)*.03-.05);var s=1+dp*1.6;c.fillRect(sx,sy,s,s);}}c.globalAlpha=1;}
  draw(); var t; addEventListener('resize',function(){clearTimeout(t);t=setTimeout(draw,150);});

  var boxes=[].slice.call(document.querySelectorAll('.digits input')), wrap=document.getElementById('digits'),
      msg=document.getElementById('msg'), go=document.getElementById('go'), form=document.getElementById('gate');
  var KEY='3deo-plan-2027-code';

  function code(){return boxes.map(function(b){return b.value;}).join('');}
  function setCode(s){boxes.forEach(function(b,i){b.value=s[i]||'';b.classList.toggle('filled',!!b.value);});}
  boxes.forEach(function(b,i){
    b.addEventListener('input',function(){
      var v=b.value.replace(/\D/g,'');
      if(v.length>1){setCode((code().slice(0,i)+v).slice(0,4));boxes[Math.min(3,i+v.length)].focus();}
      else{b.value=v; b.classList.toggle('filled',!!v); if(v&&i<3) boxes[i+1].focus();}
      wrap.classList.remove('bad'); msg.textContent=''; msg.className='msg';
      if(code().length===4) unlock();
    });
    b.addEventListener('keydown',function(e){
      if(e.key==='Backspace'&&!b.value&&i>0){boxes[i-1].focus();boxes[i-1].value='';boxes[i-1].classList.remove('filled');e.preventDefault();}
      if(e.key==='ArrowLeft'&&i>0){boxes[i-1].focus();e.preventDefault();}
      if(e.key==='ArrowRight'&&i<3){boxes[i+1].focus();e.preventDefault();}
    });
    b.addEventListener('paste',function(e){var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,4);if(t){e.preventDefault();setCode(t);boxes[Math.min(3,t.length)].focus();if(t.length===4)unlock();}});
    b.addEventListener('focus',function(){b.select();});
  });
  form.addEventListener('submit',function(e){e.preventDefault();unlock();});

  function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
  var busy=false;
  async function decrypt(pin){
    var el=document.getElementById('payload');
    var salt=b64(el.dataset.salt), iv=b64(el.dataset.iv), iter=parseInt(el.dataset.iter,10), data=b64(el.textContent.trim());
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var out=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
    return new TextDecoder().decode(out);
  }
  async function unlock(silent){
    var pin=code();
    if(busy) return;
    if(pin.length<4){ if(!silent){msg.textContent='Enter all four digits.';msg.className='msg err';} return; }
    if(!(window.crypto&&crypto.subtle)){msg.textContent='This page needs a secure (https) connection to open.';msg.className='msg err';return;}
    busy=true; go.disabled=true; msg.textContent='Checking…'; msg.className='msg';
    try{
      var html=await decrypt(pin);
      wrap.classList.add('good'); msg.textContent='Opening the plan…';
      try{sessionStorage.setItem(KEY,pin);}catch(e){}
      setTimeout(function(){document.open();document.write(html);document.close();},250);
    }catch(err){
      busy=false; go.disabled=false;
      wrap.classList.add('bad'); wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
      msg.textContent="That code didn't work. Check it and try again."; msg.className='msg err';
      setCode(''); boxes[0].focus();
      try{sessionStorage.removeItem(KEY);}catch(e){}
    }
  }
  // Re-open without asking again in the same browser tab session.
  var saved=null; try{saved=sessionStorage.getItem(KEY);}catch(e){}
  if(saved&&/^\d{4}$/.test(saved)){setCode(saved);unlock(true);} else {boxes[0].focus();}
})();
